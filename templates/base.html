{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Inicio{% endblock %} · Panadería {{ nombre_negocio }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/base.css' %}?v={{ version_estilos }}">
    <link rel="stylesheet" href="{% static 'css/menu.css' %}?v={{ version_estilos }}">
    <link rel="stylesheet" href="{% static 'css/formularios.css' %}?v={{ version_estilos }}">
    <link rel="stylesheet" href="{% static 'css/tarjetas.css' %}?v={{ version_estilos }}">
    <link rel="stylesheet" href="{% static 'css/tablas.css' %}?v={{ version_estilos }}">
    {% block estilos %}{% endblock %}
</head>
<body>
    <div class="pagina">
        {% include "componentes/menu.html" %}

        <main class="contenido">
            {% include "componentes/mensajes.html" %}
            {% block contenido %}{% endblock %}
        </main>
    </div>

    <script src="{% static 'js/menu.js' %}?v={{ version_estilos }}"></script>
    <script src="{% static 'js/formularios.js' %}?v={{ version_estilos }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
